<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Jingcheng He (kakyousei)">
<title>都市人生 · 边玩边算你的心情与每月预算 | Urban Life</title>
<link rel="stylesheet" href="css/style.css?v=122">
</head>
<body>

<header>
  <h1 id="hTitle">🌆 都市人生</h1>
  <p id="hSub"></p>
  <div class="langbar">
    <button data-lang="zh" onclick="setLang('zh')">中文</button>
    <button data-lang="ja" onclick="setLang('ja')">日本語</button>
    <button data-lang="en" onclick="setLang('en')">English</button>
  </div>
</header>

<div class="topbar">
  <span class="chip">👤 <input id="nameInput" maxlength="12" value="小拉"></span>
  <span class="chip">📅 <span id="vDate"></span></span>
  <span class="chip">💵 <span id="vCash">0</span></span>
  <span class="chip debt" id="debtChip" style="display:none">💳 <span id="vDebt">0</span></span>
  <button class="btn ghost" id="btnBudget" onclick="openModal('budget')"></button>
</div>

<div class="wrap">
  <div class="card">
    <div class="scene" id="scene">
      <span class="emoji" id="sceneEmoji">🏠</span>
      <h2 id="sceneName"></h2>
      <p id="sceneDesc"></p>
      <div><span class="speech" id="speech"></span></div>
    </div>
    <div class="map" id="map"></div>
    <div class="panel" id="panel"></div>
    <div class="bizrow">
      <button class="btn ghost" id="btnCustom" onclick="openModal('custom')"></button>
      <button class="btn ghost" id="btnMerchant" onclick="openModal('merchant')"></button>
      <button class="btn ghost" id="btnSinger" onclick="openModal('singer')"></button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><span id="lbEnergy"></span><div class="bar"><div class="f-energy" id="barEnergy"></div></div><b id="vEnergy"></b></div>
      <div class="stat"><span id="lbMood"></span><div class="bar"><div class="f-mood" id="barMood"></div></div><b id="vMood"></b></div>
      <div class="stat"><span id="lbHunger"></span><div class="bar"><div class="f-hunger" id="barHunger"></div></div><b id="vHunger"></b></div>
      <div class="stat"><span id="lbHygiene"></span><div class="bar"><div class="f-hygiene" id="barHygiene"></div></div><b id="vHygiene"></b></div>
      <div class="stat"><span id="lbSocial"></span><div class="bar"><div class="f-social" id="barSocial"></div></div><b id="vSocial"></b></div>
    </div>
    <div class="sec">
      <h3 id="hJob"></h3>
      <div class="item"><span id="jobInfo"></span><b><span id="lbXp"></span> <span id="vXp">0</span></b></div>
    </div>
    <div class="sec">
      <h3 id="hHome"></h3>
      <div class="item"><span id="homeInfo"></span></div>
    </div>
    <div class="sec">
      <h3 id="hBudget"></h3>
      <div id="budgetPanel"></div>
    </div>
    <div class="sec" id="debtSec" style="display:none">
      <h3 id="hDebt"></h3>
      <div class="item"><span id="debtInfo"></span><button class="mini pink" id="btnRepay" onclick="doRepay()"></button></div>
    </div>
    <div class="sec">
      <h3 id="hBag"></h3>
      <div id="bag" class="list"></div>
    </div>
    <div class="sec">
      <h3 id="hFriends"></h3>
      <div id="friends"></div>
    </div>
    <div class="sec">
      <h3 id="hDiary"></h3>
      <div class="diary" id="diary"></div>
    </div>
    <div class="sec" style="text-align:right">
      <button class="btn ghost" id="btnReset" style="box-shadow:none; font-size:12.5px; padding:5px 10px;"></button>
    </div>
  </div>
</div>

<footer id="footNote"></footer>
<p class="credit" style="text-align:center; font-size:12px; opacity:.65; margin:10px 0 26px">© 2026 Jingcheng He (kakyousei) · 都市人生 Urban Life · Original repository: <a href="https://github.com/kakyousei/urban-life-game" style="color:inherit">github.com/kakyousei/urban-life-game</a> · MIT License</p>

<div class="overlay" id="modal-budget">
  <div class="modal">
    <button class="x" onclick="closeModal('budget')">✕</button>
    <h3 id="bTitle"></h3>
    <p class="note" id="bNote"></p>
    <h4 id="bCur" style="margin:10px 0 6px"></h4>
    <div id="bSummary" style="font-size:14px; line-height:1.9"></div>
    <label id="bCashLb"></label><input id="bCash" type="number" min="0">
    <label id="bFoodLb"></label><input id="bFood" type="number" min="0" step="500">
    <label id="bTransportLb"></label><input id="bTransport" type="number" min="0" step="500">
    <label id="bFunLb"></label><input id="bFun" type="number" min="0" step="500">
    <label id="bShopLb"></label><input id="bShop" type="number" min="0" step="500">
    <label id="bGoalLb"></label><input id="bGoal" type="number" min="0" step="1000">
    <div class="gate"><button class="stripe" style="background:var(--teal); color:#04382b;" onclick="saveBudget()" id="bSave"></button></div>
    <p class="note" id="bMsg"></p>
  </div>
</div>

<div class="overlay" id="modal-report">
  <div class="modal">
    <button class="x" onclick="closeModal('report')">✕</button>
    <h3 id="rTitle"></h3>
    <div id="rBody" style="font-size:14.5px; line-height:1.8"></div>
  </div>
</div>

<div class="overlay" id="modal-merchant">
  <div class="modal">
    <button class="x" onclick="closeModal('merchant')">✕</button>
    <h3 id="meTitle"></h3>
    <p class="note" id="meNote"></p>
    <label id="meBizLb"></label><input id="mBiz">
    <label id="meCatLb"></label>
    <select id="mCat"></select>
    <label id="mePlaceLb"></label>
    <select id="mPlace"></select>
    <label id="meLinkLb"></label><input id="mLink" placeholder="https://…">
    <p class="note" id="mePayNote"></p>
    <div class="gate"><button class="stripe" style="background:var(--gold); color:#6b4700;" onclick="submitMerchant()" id="meGo"></button></div>
    <p class="note" id="mMsg"></p>
  </div>
</div>

<div class="overlay" id="modal-singer">
  <div class="modal">
    <button class="x" onclick="closeModal('singer')">✕</button>
    <h3 id="siTitle"></h3>
    <p class="note" id="siNote"></p>
    <label id="siNameLb"></label><input id="sName">
    <label id="siSongLb"></label><input id="sTitle">
    <label id="siLinkLb"></label><input id="sLink" placeholder="https://…">
    <p class="note" id="siPayNote"></p>
    <div class="gate"><button class="stripe" style="background:var(--pink);" onclick="submitSinger()" id="siGo"></button></div>
    <p class="note" id="sMsg"></p>
  </div>
</div>

<div class="overlay" id="modal-custom">
  <div class="modal">
    <button class="x" onclick="closeModal('custom')">✕</button>
    <h3 id="cuTitle"></h3>
    <p class="note" id="cuNote"></p>
    <label id="cuTypeLb"></label>
    <select id="cType"><option value="shop"></option><option value="npc"></option><option value="home"></option><option value="job"></option><option value="food"></option><option value="goods"></option><option value="place"></option><option value="transport"></option><option value="office"></option><option value="club"></option><option value="hotel"></option><option value="ktv"></option></select>
    <label id="cuNameLb"></label><input id="cName">
    <label id="cuDescLb"></label><input id="cDesc">
    <div id="cuNum1Wrap" style="display:none"><label id="cuNum1Lb"></label><input id="cNum1" type="number" min="0" step="1"></div>
    <div id="cuNum2Wrap" style="display:none"><label id="cuNum2Lb"></label><input id="cNum2" type="number" min="0" step="1"></div>
    <div id="cuFxWrap" style="display:none"><label id="cuFxLb"></label><select id="cFx"></select></div>
    <div id="cuEmojiWrap" style="display:none"><label id="cuEmojiLb"></label><select id="cEmoji"><option>🌳</option><option>🏋️</option><option>📚</option><option>🎨</option><option>🏊</option><option>☕</option><option>🎮</option><option>🧘</option></select></div>
    <div class="gate"><button class="stripe" style="background:var(--teal); color:#04382b;" onclick="submitCustom()" id="cuGo"></button></div>
    <p class="note" id="cMsg"></p>
    <div id="customList"></div>
  </div>
</div>

<script src="js/i18n.js?v=122"></script>
<script src="js/data.js?v=122"></script>
<script src="js/fx.js?v=122"></script>
<script src="js/core.js?v=122"></script>
<script src="js/ui.js?v=122"></script>
<script src="js/actions.js?v=122"></script>
<script src="js/budget.js?v=122"></script>
<script src="js/portals.js?v=122"></script>
<script src="js/custom.js?v=122"></script>
<script src="js/app.js?v=122"></script>
</body>
</html>
