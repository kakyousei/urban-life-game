<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奈拉人生 · Naira Life</title>
<style>
  :root{
    --gold:#ffb703; --teal:#06d6a0; --ink:#1d2733; --card:#ffffff;
    --bg1:#0f2027; --bg2:#203a43; --bg3:#2c5364; --pink:#ef476f; --soft:#f4f7f9;
    --shadow:0 10px 30px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3)); min-height:100vh; padding:16px 12px 44px;}
  header{text-align:center; color:#fff; margin-bottom:8px;}
  header h1{margin:2px 0; font-size:clamp(24px,5vw,36px); letter-spacing:1px;}
  header p{margin:0; opacity:.85; font-size:14px;}
  .langbar{display:flex; gap:6px; justify-content:center; margin-top:8px;}
  .langbar button{border:2px solid rgba(255,255,255,.4); background:transparent; color:#fff; border-radius:999px;
    padding:4px 14px; cursor:pointer; font-size:13.5px; font-weight:700;}
  .langbar button.on{background:var(--gold); border-color:var(--gold); color:#6b4700;}
  .langbar.dark{justify-content:flex-start; margin:0 0 12px;}
  .langbar.dark button{border-color:#c3d2d9; color:var(--ink);}
  .langbar.dark button.on{background:var(--gold); border-color:var(--gold); color:#6b4700;}
  .topbar{max-width:1020px; margin:10px auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center;}
  .chip{background:#ffffff; border-radius:999px; padding:6px 14px; font-weight:700; font-size:14.5px; box-shadow:var(--shadow);}
  .chip input{border:none; font:inherit; width:90px; text-align:center; background:transparent; outline:none;}
  .chip.debt{background:#ffe3e3; color:#9d0208;}
  .btn{border:none; cursor:pointer; border-radius:999px; padding:8px 16px; font-weight:800; font-size:14.5px;
    background:linear-gradient(180deg,#ffe98a,var(--gold)); color:#6b4700; box-shadow:0 3px 0 #c98f04;}
  .btn:active{transform:translateY(2px); box-shadow:none;}
  .btn.ghost{background:#fff; color:var(--ink); box-shadow:0 3px 0 #b9c6cc;}
  .wrap{max-width:1020px; margin:0 auto; display:grid; grid-template-columns:1.2fr .8fr; gap:14px;}
  @media (max-width:820px){ .wrap{grid-template-columns:1fr;} }
  .card{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:16px;}
  .scene{border-radius:16px; padding:18px 14px; text-align:center; color:#fff; min-height:150px;
    background:linear-gradient(180deg,#35586c,#22384a); position:relative; overflow:hidden;}
  .scene .emoji{font-size:58px; display:block; margin-bottom:4px;}
  .scene h2{margin:2px 0; font-size:22px;}
  .scene p{margin:2px 0; opacity:.9; font-size:14px;}
  .scene.night{background:linear-gradient(180deg,#1b1035,#3b1850);}
  .speech{margin-top:10px; background:#fff; color:var(--ink); border-radius:999px; display:inline-block;
    padding:7px 16px; font-size:14.5px; box-shadow:0 4px 10px rgba(0,0,0,.2); min-height:20px;}
  .map{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:14px;}
  @media (max-width:560px){ .map{grid-template-columns:repeat(3,1fr);} }
  button.loc{border:2px solid #e3ecef; background:var(--soft); border-radius:14px; padding:10px 4px; cursor:pointer;
    font-size:14px; font-weight:700; color:var(--ink);}
  button.loc small{display:block; font-weight:500; font-size:11.5px; opacity:.65; margin-top:2px;}
  button.loc.active{border-color:var(--gold); background:#fff7e0;}
  .panel{margin-top:14px;}
  .panel h3{margin:0 0 8px; font-size:16.5px;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  button.act{flex:1 1 150px; border:none; cursor:pointer; border-radius:14px; padding:11px 8px; font-size:14.5px; font-weight:700;
    background:linear-gradient(180deg,#ffffff,#eef6f8); color:var(--ink); box-shadow:0 3px 0 #c3d3da; text-align:left;}
  button.act small{display:block; font-weight:500; font-size:12px; opacity:.7; margin-top:2px;}
  button.act:disabled{opacity:.45; cursor:not-allowed;}
  button.act:active{transform:translateY(2px); box-shadow:none;}
  .list{display:grid; gap:8px;}
  .item{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--soft);
    border-radius:12px; padding:9px 12px; font-size:14px;}
  .item b{font-size:14.5px;}
  .item small{display:block; opacity:.7; font-weight:500;}
  .mini{border:none; cursor:pointer; border-radius:999px; padding:6px 14px; font-weight:700; font-size:13px;
    background:var(--teal); color:#04382b; white-space:nowrap;}
  .mini:disabled{opacity:.45; cursor:not-allowed;}
  .mini.pink{background:var(--pink); color:#fff;}
  .stats{display:grid; gap:9px;}
  .stat{display:grid; grid-template-columns:74px 1fr 32px; gap:8px; align-items:center; font-size:14px;}
  .bar{height:13px; background:#e8eef1; border-radius:999px; overflow:hidden;}
  .bar>div{height:100%; border-radius:999px; transition:width .4s;}
  .f-energy{background:linear-gradient(90deg,#ffd93b,#ffb703);}
  .f-mood{background:linear-gradient(90deg,#ff8fab,#ef476f);}
  .f-social{background:linear-gradient(90deg,#6ee7ff,#118ab2);}
  .f-hunger{background:linear-gradient(90deg,#ffb35c,#f4841f);}
  .f-hygiene{background:linear-gradient(90deg,#a0e7b5,#2a9d5c);}
  .sec{margin-top:14px;}
  .sec h3{margin:0 0 8px; font-size:16px;}
  .friend{display:flex; justify-content:space-between; align-items:center; background:var(--soft); border-radius:12px; padding:8px 12px; font-size:14px; margin-bottom:6px;}
  .heartbar{width:90px; height:9px; background:#e8eef1; border-radius:99px; overflow:hidden; display:inline-block; vertical-align:middle;}
  .heartbar>div{height:100%; background:linear-gradient(90deg,#ff8fab,#ef476f);}
  .diary{background:#fffaf0; border:1.5px dashed #e0c08a; border-radius:14px; padding:10px 14px; font-size:13.5px;
    line-height:1.8; max-height:190px; overflow:auto;}
  .diary p{margin:0;}
  .billboard{background:linear-gradient(90deg,#ffe98a,#ffb703); border-radius:12px; padding:10px 12px; font-weight:800;
    text-align:center; margin-bottom:8px; color:#6b4700;}
  .songline{background:#241536; color:#ffd7ef; border-radius:12px; padding:8px 12px; font-size:13.5px; margin-bottom:6px;}
  .bizrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .overlay{position:fixed; inset:0; background:rgba(10,20,28,.6); display:none; align-items:center; justify-content:center; z-index:20; padding:14px;}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:20px; max-width:430px; width:100%; padding:20px; max-height:88vh; overflow:auto;}
  .modal h3{margin:0 0 6px; font-size:19px;}
  .modal p.note{font-size:13px; opacity:.75; margin:4px 0 10px; line-height:1.6;}
  .modal label{display:block; font-size:13.5px; font-weight:700; margin:10px 0 4px;}
  .modal input,.modal select{width:100%; padding:9px 10px; border:2px solid #dfe9ec; border-radius:10px; font-size:14.5px;}
  .pack{display:flex; justify-content:space-between; align-items:center; border:2px solid #ffe1a8; background:#fffaf0;
    border-radius:14px; padding:10px 12px; margin-bottom:8px; cursor:pointer; font-weight:700;}
  .pack.sel{border-color:var(--gold); background:#fff3d6;}
  .gate{display:flex; gap:8px; margin-top:8px;}
  .gate button{flex:1; border:none; border-radius:12px; padding:11px; font-weight:800; cursor:pointer; font-size:15px;}
  .gate .stripe{background:#635bff; color:#fff;}
  .gate .paystack{background:#00c3f7; color:#003a47;}
  .x{float:right; border:none; background:#eef3f5; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:15px;}
  .bgcard{border:2.5px solid #e3ecef; border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer;}
  .bgcard:hover{border-color:var(--gold); background:#fffaf0;}
  .bgcard h4{margin:0 0 4px; font-size:16.5px;}
  .bgcard p{margin:0; font-size:13.5px; opacity:.8; line-height:1.6;}
  footer{max-width:1020px; margin:16px auto 0; color:#cfe3ec; font-size:12.5px; text-align:center; opacity:.85; line-height:1.7;}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">🌆 奈拉人生</h1>
  <p id="hSub"></p>
  <div class="langbar">
    <button data-lang="zh" onclick="setLang('zh')">中文</button>
    <button data-lang="ja" onclick="setLang('ja')">日本語</button>
    <button data-lang="en" onclick="setLang('en')">English</button>
  </div>
</header>

<div class="topbar">
  <span class="chip">👤 <input id="nameInput" maxlength="12" value="小拉"></span>
  <span class="chip">📅 <span id="vDate"></span></span>
  <span class="chip">💵 ₦<span id="vCash">0</span></span>
  <span class="chip">🪙 <span id="vCoins">0</span></span>
  <span class="chip debt" id="debtChip" style="display:none">💳 ₦<span id="vDebt">0</span></span>
  <button class="btn" id="btnTopup" onclick="openModal('topup')"></button>
</div>

<div class="wrap">
  <div class="card">
    <div class="scene" id="scene">
      <span class="emoji" id="sceneEmoji">🏠</span>
      <h2 id="sceneName"></h2>
      <p id="sceneDesc"></p>
      <div><span class="speech" id="speech"></span></div>
    </div>
    <div class="map" id="map"></div>
    <div class="panel" id="panel"></div>
    <div class="bizrow">
      <button class="btn ghost" id="btnCustom" onclick="openModal('custom')"></button>
      <button class="btn ghost" id="btnMerchant" onclick="openModal('merchant')"></button>
      <button class="btn ghost" id="btnSinger" onclick="openModal('singer')"></button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><span id="lbEnergy"></span><div class="bar"><div class="f-energy" id="barEnergy"></div></div><b id="vEnergy"></b></div>
      <div class="stat"><span id="lbMood"></span><div class="bar"><div class="f-mood" id="barMood"></div></div><b id="vMood"></b></div>
      <div class="stat"><span id="lbHunger"></span><div class="bar"><div class="f-hunger" id="barHunger"></div></div><b id="vHunger"></b></div>
      <div class="stat"><span id="lbHygiene"></span><div class="bar"><div class="f-hygiene" id="barHygiene"></div></div><b id="vHygiene"></b></div>
      <div class="stat"><span id="lbSocial"></span><div class="bar"><div class="f-social" id="barSocial"></div></div><b id="vSocial"></b></div>
    </div>
    <div class="sec">
      <h3 id="hJob"></h3>
      <div class="item"><span id="jobInfo"></span><b><span id="lbXp"></span> <span id="vXp">0</span></b></div>
    </div>
    <div class="sec">
      <h3 id="hHome"></h3>
      <div class="item"><span id="homeInfo"></span></div>
    </div>
    <div class="sec" id="debtSec" style="display:none">
      <h3 id="hDebt"></h3>
      <div class="item"><span id="debtInfo"></span><button class="mini pink" id="btnRepay" onclick="doRepay()"></button></div>
    </div>
    <div class="sec">
      <h3 id="hBag"></h3>
      <div id="bag" class="list"></div>
    </div>
    <div class="sec">
      <h3 id="hFriends"></h3>
      <div id="friends"></div>
    </div>
    <div class="sec">
      <h3 id="hDiary"></h3>
      <div class="diary" id="diary"></div>
    </div>
    <div class="sec" style="text-align:right">
      <button class="btn ghost" id="btnReset" style="box-shadow:none; font-size:12.5px; padding:5px 10px;"></button>
    </div>
  </div>
</div>

<footer id="footNote"></footer>

<div class="overlay" id="modal-start">
  <div class="modal">
    <h3 id="stTitle"></h3>
    <p class="note" id="stNote"></p>
    <div class="langbar dark">
      <button data-lang="zh" onclick="setLang('zh')">中文</button>
      <button data-lang="ja" onclick="setLang('ja')">日本語</button>
      <button data-lang="en" onclick="setLang('en')">English</button>
    </div>
    <div id="bgList"></div>
  </div>
</div>

<div class="overlay" id="modal-topup">
  <div class="modal">
    <button class="x" onclick="closeModal('topup')">✕</button>
    <h3 id="tpTitle"></h3>
    <p class="note" id="tpNote"></p>
    <div id="packs"></div>
    <div class="gate">
      <button class="stripe" onclick="payDemo('Stripe')" id="tpStripe"></button>
      <button class="paystack" onclick="payDemo('Paystack')" id="tpPaystack"></button>
    </div>
    <p class="note" id="payMsg"></p>
  </div>
</div>

<div class="overlay" id="modal-merchant">
  <div class="modal">
    <button class="x" onclick="closeModal('merchant')">✕</button>
    <h3 id="meTitle"></h3>
    <p class="note" id="meNote"></p>
    <label id="meBizLb"></label><input id="mBiz">
    <label id="meCatLb"></label>
    <select id="mCat"></select>
    <label id="mePlaceLb"></label>
    <select id="mPlace"></select>
    <div class="gate"><button class="stripe" style="background:var(--gold); color:#6b4700;" onclick="submitMerchant()" id="meGo"></button></div>
    <p class="note" id="mMsg"></p>
  </div>
</div>

<div class="overlay" id="modal-singer">
  <div class="modal">
    <button class="x" onclick="closeModal('singer')">✕</button>
    <h3 id="siTitle"></h3>
    <p class="note" id="siNote"></p>
    <label id="siNameLb"></label><input id="sName">
    <label id="siSongLb"></label><input id="sTitle">
    <label id="siLinkLb"></label><input id="sLink" placeholder="https://…">
    <div class="gate"><button class="stripe" style="background:var(--pink);" onclick="submitSinger()" id="siGo"></button></div>
    <p class="note" id="sMsg"></p>
  </div>
</div>

<div class="overlay" id="modal-custom">
  <div class="modal">
    <button class="x" onclick="closeModal('custom')">✕</button>
    <h3 id="cuTitle"></h3>
    <p class="note" id="cuNote"></p>
    <label id="cuTypeLb"></label>
    <select id="cType"><option value="shop"></option><option value="npc"></option></select>
    <label id="cuNameLb"></label><input id="cName">
    <label id="cuDescLb"></label><input id="cDesc">
    <div class="gate"><button class="stripe" style="background:var(--teal); color:#04382b;" onclick="submitCustom()" id="cuGo"></button></div>
    <p class="note" id="cMsg"></p>
    <div id="customList"></div>
  </div>
</div>

var selPack=1, lastSay={k:"sStart", a:[]};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function sayT(k){ lastSay={k:k, a:Array.prototype.slice.call(arguments,1)}; $("speech").textContent=fmt.apply(null,[k].concat(lastSay.a)); }
function logT(k){ S.diary.unshift({k:k, a:Array.prototype.slice.call(arguments,1), d:S.day}); if(S.diary.length>40) S.diary.length=40; renderDiary(); }
function renderDiary(){
  var w=$("diary"); w.innerHTML="";
  S.diary.forEach(function(e){
    var p=document.createElement("p");
    p.textContent=fmt("diaryDayF", e.d)+" · "+fmt.apply(null,[e.k].concat(e.a));
    w.appendChild(p);
  });
}
function loc(){ for(var i=0;i<LOCS.length;i++) if(LOCS[i].id===S.loc) return LOCS[i]; return LOCS[0]; }
function isNight(){ return S.hour>=18 || S.hour<5; }
function jobPay(){ if(!S.job) return 0; var base=0; for(var i=0;i<JOBS.length;i++) if(L(JOBS[i].title)===S.job || JOBS[i].title.zh===S.job) base=JOBS[i].pay; return Math.round(base*(1+0.25*(S.jobLevel-1))); }
function jobTitleObj(){ for(var i=0;i<JOBS.length;i++) if(JOBS[i].title.zh===S.job) return JOBS[i]; return null; }
function hasItem(zhName){ return S.items.indexOf(zhName)>=0; }
function advance(h){
  for(var i=0;i<h;i++){
    S.hour+=1; S.hunger=clamp(S.hunger-2); S.hygiene=clamp(S.hygiene-1);
    if(S.hour>=24){ S.hour-=24; newDay(); }
  }
  if(S.energy<=5) sayT("sTired"); else if(S.hunger<=10) sayT("sHungry"); else if(S.hygiene<=15) sayT("sDirty");
}
function newDay(){
  S.day+=1; logT("lNewDay");
  S.ads=S.ads.filter(function(a){ a.days-=1; if(a.days<=0){ logT("lAdExp", a.biz); return false; } return true; });
  S.songs=S.songs.filter(function(g){ g.days-=1; if(g.days<=0){ logT("lSongExp", g.title); return false; } return true; });
  if(S.day%7===1 && S.day>1){
    var rent=HOMES[S.home].rent;
    if(S.cash>=rent){ S.cash-=rent; logT("lRent", fmtN(rent)); sayT("sRentPaid", fmtN(rent)); }
    else { var short=rent-S.cash; S.cash=0; S.debt+=short; logT("lRentDebt", fmtN(short)); sayT("sRentDebt", fmtN(rent)); }
    if(S.debt>0){ S.debt=Math.round(S.debt*1.05); }
  }
  var r=Math.random();
  if(r<0.22){
    if(hasItem("太阳能供电套装")||hasItem("小型发电机")){ logT("lNewDay"); sayT("sEvPowerGen"); }
    else { S.mood=clamp(S.mood-6); sayT("sEvPower"); }
  } else if(r<0.34){ var gig=2000+Math.floor(Math.random()*3)*500; S.cash+=gig; sayT("sEvGig", fmtN(gig)); }
  else if(r<0.42){ S.hunger=clamp(S.hunger+12); sayT("sEvTreat"); }
}
function spendCash(n){ if(S.cash<n){ sayT("sNoCash"); return false; } S.cash-=n; return true; }
function spendCoins(n){ if(S.coins<n){ sayT("sNoCoins"); return false; } S.coins-=n; return true; }
function go(id){
  var from=loc(), to=null;
  for(var i=0;i<LOCS.length;i++) if(LOCS[i].id===id) to=LOCS[i];
  if(to && from.id!==to.id && from.dist!=="any" && to.dist!=="any" && from.dist!==to.dist){
    if(S.cash>=250){ S.cash-=250; sayT("sFare"); }
    else { advance(1); S.energy=clamp(S.energy-6); sayT("sWalkFar"); }
    if(Math.random()<0.18){ advance(1); S.mood=clamp(S.mood-5); sayT("sTraffic"); }
  }
  S.loc=id; render(); window.scrollTo({top:0, behavior:"smooth"});
}
function allNpcs(){
  var list=NPCS.slice();
  S.customNpcs.forEach(function(c,i){ list.push({id:"cus"+i, emoji:"🧑", name:c.name, job:c.desc||t("myFriend"), line:c.desc||""}); });
  return list;
}
function npcById(id){ var a=allNpcs(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return a[0]; }
</script>

<script>
"use strict";
function setLang(l){
  LANG=l; localStorage.setItem(LANGKEY, l);
  document.documentElement.lang = l==="ja" ? "ja" : (l==="en" ? "en" : "zh-CN");
  document.title = t("title").replace("🌆 ","") + " · Naira Life";
  render();
}
function applyStatic(){
  $("hTitle").textContent=t("title");
  $("hSub").textContent=t("sub");
  $("btnTopup").textContent=t("topup");
  $("btnCustom").textContent=t("btnCustom");
  $("btnMerchant").textContent=t("btnMerchant");
  $("btnSinger").textContent=t("btnSinger");
  $("lbEnergy").textContent=t("stEnergy"); $("lbMood").textContent=t("stMood");
  $("lbHunger").textContent=t("stHunger"); $("lbHygiene").textContent=t("stHygiene"); $("lbSocial").textContent=t("stSocial");
  $("hJob").textContent=t("hJob"); $("hHome").textContent=t("hHome"); $("hDebt").textContent=t("hDebt");
  $("hBag").textContent=t("hBag"); $("hFriends").textContent=t("hFriends"); $("hDiary").textContent=t("hDiary");
  $("lbXp").textContent=t("xpW"); $("btnRepay").textContent=t("repayBtn"); $("btnReset").textContent=t("reset");
  $("footNote").innerHTML=t("foot");
  $("stTitle").textContent=t("stTitle"); $("stNote").textContent=t("stNote");
  $("tpTitle").textContent=t("tpTitle"); $("tpNote").innerHTML=t("tpNote");
  $("tpStripe").textContent=t("tpStripe"); $("tpPaystack").textContent=t("tpPaystack");
  $("meTitle").textContent=t("meTitle"); $("meNote").textContent=t("meNote");
  $("meBizLb").textContent=t("meBizLb"); $("mBiz").placeholder=t("meBizPh");
  $("meCatLb").textContent=t("meCatLb"); $("mePlaceLb").textContent=t("mePlaceLb");
  var mc=$("mCat"); mc.innerHTML=""; CATS.forEach(function(c){ var o=document.createElement("option"); o.textContent=L(c); mc.appendChild(o); });
  var mp=$("mPlace"); mp.innerHTML="";
  [["street","placeStreet"],["mall","placeMall"],["club","placeClub"]].forEach(function(x){ var o=document.createElement("option"); o.value=x[0]; o.textContent=t(x[1]); mp.appendChild(o); });
  $("meGo").textContent=t("meGo");
  $("siTitle").textContent=t("siTitle"); $("siNote").textContent=t("siNote");
  $("siNameLb").textContent=t("siNameLb"); $("sName").placeholder=t("siNamePh");
  $("siSongLb").textContent=t("siSongLb"); $("sTitle").placeholder=t("siSongPh");
  $("siLinkLb").textContent=t("siLinkLb"); $("siGo").textContent=t("siGo");
  $("cuTitle").textContent=t("cuTitle"); $("cuNote").textContent=t("cuNote");
  $("cuTypeLb").textContent=t("cuTypeLb");
  $("cType").options[0].textContent=t("cuTypeShop"); $("cType").options[1].textContent=t("cuTypeNpc");
  $("cuNameLb").textContent=t("cuNameLb"); $("cName").placeholder=t("cuNamePh");
  $("cuDescLb").textContent=t("cuDescLb"); $("cDesc").placeholder=t("cuDescPh");
  $("cuGo").textContent=t("cuGo");
  var bl=$("bgList"); bl.innerHTML="";
  BGS.forEach(function(b,i){
    var d=document.createElement("div"); d.className="bgcard";
    d.innerHTML="<h4>"+L(b.name)+"</h4><p>"+L(b.desc)+"<br>💵 ₦"+fmtN(b.cash)+" · 🪙 "+b.coins+(b.debt?" · 💳 ₦"+fmtN(b.debt):"")+"</p>";
    d.onclick=function(){ chooseBg(i); };
    bl.appendChild(d);
  });
  document.querySelectorAll("[data-lang]").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang")===LANG); });
}
function chooseBg(i){
  var b=BGS[i];
  S.cash=b.cash; S.coins=b.coins; S.home=b.home; S.debt=b.debt; S.started=true;
  $("modal-start").classList.remove("show");
  logT("lStart", L(b.name)); sayT("sStart"); render();
}
function render(){
  applyStatic();
  $("vDate").textContent=fmt("dayF", S.day, (S.hour<10?"0":"")+S.hour+":00");
  $("vCash").textContent=fmtN(S.cash); $("vCoins").textContent=fmtN(S.coins);
  $("debtChip").style.display=S.debt>0?"":"none"; $("vDebt").textContent=fmtN(S.debt);
  $("debtSec").style.display=S.debt>0?"":"none";
  if(S.debt>0) $("debtInfo").textContent=fmt("debtInfo", fmtN(S.debt));
  $("barEnergy").style.width=S.energy+"%"; $("vEnergy").textContent=S.energy;
  $("barMood").style.width=S.mood+"%"; $("vMood").textContent=S.mood;
  $("barHunger").style.width=S.hunger+"%"; $("vHunger").textContent=S.hunger;
  $("barHygiene").style.width=S.hygiene+"%"; $("vHygiene").textContent=S.hygiene;
  $("barSocial").style.width=S.social+"%"; $("vSocial").textContent=S.social;
  $("vXp").textContent=S.xp;
  var jt=jobTitleObj();
  $("jobInfo").textContent = jt ? fmt("jobInfo", L(jt.title), S.jobLevel, fmtN(jobPay())) : t("noJob");
  $("homeInfo").textContent=fmt("homeInfo", L(HOMES[S.home].name), fmtN(HOMES[S.home].rent));
  if(document.activeElement!==$("nameInput")) $("nameInput").value=S.name;
  var Lc=loc();
  $("sceneEmoji").textContent=Lc.emoji; $("sceneName").textContent=L(Lc.title); $("sceneDesc").textContent=L(Lc.desc);
  $("scene").classList.toggle("night", isNight());
  $("speech").textContent=fmt.apply(null,[lastSay.k].concat(lastSay.a));
  var map=$("map"); map.innerHTML="";
  LOCS.forEach(function(x){
    var b=document.createElement("button");
    b.className="loc"+(x.id===S.loc?" active":"");
    b.innerHTML=x.icon+" "+L(x.name)+"<small>"+x.dist.toUpperCase()+"</small>";
    b.onclick=function(){ go(x.id); };
    map.appendChild(b);
  });
  var bag=$("bag"); bag.innerHTML="";
  if(S.items.length===0 && S.gifts===0){ bag.innerHTML='<div class="item"><span>'+t("bagEmpty")+'</span></div>'; }
  S.items.forEach(function(zh){
    var g=null; GOODS.forEach(function(x){ if(x.name.zh===zh) g=x; });
    var d=document.createElement("div"); d.className="item"; d.innerHTML="<span>🎁 "+(g?L(g.name):zh)+"</span>"; bag.appendChild(d);
  });
  if(S.gifts>0){ var gd=document.createElement("div"); gd.className="item"; gd.innerHTML="<span>"+fmt("giftX", S.gifts)+"</span><small>"+t("giftHint")+"</small>"; bag.appendChild(gd); }
  var fr=$("friends"); fr.innerHTML="";
  allNpcs().forEach(function(n){
    var pts=S.friends[n.id]||0;
    var d=document.createElement("div"); d.className="friend";
    d.innerHTML="<span>"+n.emoji+" <b>"+n.name+"</b> · "+(typeof n.job==="string"?n.job:L(n.job))+"</span><span class='heartbar'><div style='width:"+Math.min(100,pts)+"%'></div></span> "+pts;
    fr.appendChild(d);
  });
  renderDiary();
  renderPanel();
  save();
}
function actBtn(label, sub, fn, disabled){
  return '<button class="act" onclick="'+fn+'" '+(disabled?"disabled":"")+'>'+label+'<small>'+sub+'</small></button>';
}
function renderPanel(){
  var p=$("panel"), h="";
  if(S.loc==="home"){
    h="<h3>"+t("pHome")+"</h3><div class='row'>"
      + actBtn(t("aSleep"), t("aSleepS"), "doSleep()")
      + actBtn(t("aRest"), t("aRestS"), "doRest()")
      + actBtn(t("aShower"), t("aShowerS"), "doShower()")
      + actBtn(t("aNoodle"), t("aNoodleS"), "doNoodle()")
      + "</div><h3 style='margin-top:12px'>"+t("moveH")+"</h3><div class='list'>";
    HOMES.forEach(function(hm,i){
      h+="<div class='item'><span><b>"+L(hm.name)+"</b><small>"+t("rentW")+" ₦"+fmtN(hm.rent)+"</small></span>"
        + (i===S.home ? "<b>"+t("curHome")+"</b>" : "<button class='mini' onclick='doMove("+i+")'>"+t("moveBtn")+"</button>") + "</div>";
    });
    h+="</div>";
  }
  if(S.loc==="jobs"){
    h="<h3>"+t("pJobs")+"</h3><div class='list'>";
    JOBS.forEach(function(j,i){
      var cur=S.job===j.title.zh, ok=S.xp>=j.xp && !cur;
      h+="<div class='item'><span><b>"+L(j.title)+"</b> · ₦"+fmtN(j.pay)+"<small>"+L(j.desc)+"（"+fmt("xpNeed", j.xp)+"）</small></span>"
        + (cur ? "<b>"+t("onJob")+"</b>" : "<button class='mini' onclick='applyJob("+i+")' "+(ok?"":"disabled")+">"+t("apply")+"</button>") + "</div>";
    });
    h+="</div><p style='font-size:13px;opacity:.7'>"+t("jobsHint")+"</p>";
  }
  if(S.loc==="office"){
    h="<h3>"+t("pOffice")+"</h3><div class='row'>";
    if(S.job){
      h+= actBtn(t("aWork"), fmt("aWorkS", fmtN(jobPay())), "doWork()")
        + actBtn(t("aOfficeChat"), t("aOfficeChatS"), "doOfficeChat()");
    } else {
      h+= actBtn(t("noJobGo"), t("noJobGoS"), "go('jobs')");
    }
    h+="</div>";
  }
  if(S.loc==="club"){
    h="<h3>"+t("pClub")+"</h3>";
    S.ads.filter(function(a){return a.place==="club";}).forEach(function(a){ h+="<div class='billboard'>"+fmt("sponsorF", a.biz, a.cat)+"</div>"; });
    h+="<div id='playlist'></div><div class='row'>"
      + actBtn(t("aDance"), t("aDanceS"), "doDance()")
      + actBtn(t("aClubChat"), t("aClubChatS"), "doClubChat()")
      + actBtn(t("aVip"), t("aVipS"), "doVip()")
      + "</div>";
  }
  if(S.loc==="hotel"){
    h="<h3>🏨</h3><div class='list'>"
      + "<div class='item'><span><b>"+t("hotelStd")+"</b><small>"+t("hotelStdS")+"</small></span><button class='mini' onclick='doHotel(0)'>"+t("checkin")+"</button></div>"
      + "<div class='item'><span><b>"+t("hotelLux")+"</b><small>"+t("hotelLuxS")+"</small></span><button class='mini pink' onclick='doHotel(1)'>"+t("checkin")+"</button></div>"
      + "<div class='item'><span><b>"+t("hotelTea")+"</b><small>"+t("hotelTeaS")+"</small></span><button class='mini' onclick='doTea()'>"+t("order1")+"</button></div>"
      + "</div>";
  }
  if(S.loc==="food"){
    h="<h3>"+t("pFood")+"</h3><div class='list'>";
    FOODS.forEach(function(fd,i){
      h+="<div class='item'><span><b>"+L(fd.name)+"</b> · ₦"+fmtN(fd.price)+"<small>"+L(fd.desc)+" "+fmt("foodFx", fd.hunger, fd.mood)+"</small></span><button class='mini' onclick='doEat("+i+")'>"+t("eatBtn")+"</button></div>";
    });
    h+="</div>";
  }
  if(S.loc==="ktv"){
    h="<h3>"+t("pKtv")+"</h3><div class='row'>"
      + actBtn(t("aKtv0"), t("aKtv0S"), "doKtv(0)")
      + actBtn(t("aKtv1"), t("aKtv1S"), "doKtv(1)")
      + "</div>";
  }
  if(S.loc==="mall"){
    var recs=S.ads.filter(function(a){return a.place==="mall";});
    if(recs.length){ h="<h3>"+t("recH")+"</h3><div class='list'>";
      recs.forEach(function(a){ h+="<div class='item'><span>🏪 <b>"+a.biz+"</b><small>"+a.cat+"</small></span><button class='mini' onclick='visitBiz()'>"+t("visit")+"</button></div>"; });
      h+="</div><h3 style='margin-top:12px'>"+t("shelfH")+"</h3>";
    } else h="<h3>"+t("shelfH")+"</h3>";
    h+="<div class='list'>";
    GOODS.forEach(function(g,i){
      var owned=S.items.indexOf(g.name.zh)>=0;
      h+="<div class='item'><span><b>"+L(g.name)+"</b> · ₦"+fmtN(g.price)+"<small>"+L(g.tag)+"</small></span>"
        + (owned && g.once ? "<b>"+t("owned")+"</b>" : "<button class='mini' onclick='doBuy("+i+")'>"+t("buy")+"</button>") + "</div>";
    });
    h+="</div>";
  }
  if(S.loc==="street"){
    h="<h3>"+t("pStreet")+"</h3>";
    S.ads.filter(function(a){return a.place==="street";}).forEach(function(a){ h+="<div class='billboard'>"+fmt("boardF", a.biz, a.cat)+"</div>"; });
    h+="<div class='row'>"
      + actBtn(t("aWalk"), t("aWalkS"), "doWalk()")
      + actBtn(t("aMarket"), t("aMarketS"), "doMarket()")
      + "</div>";
    if(S.customShops.length){
      h+="<h3 style='margin-top:12px'>"+t("customH")+"</h3><div class='list'>";
      S.customShops.forEach(function(c,i){
        h+="<div class='item'><span><b>"+c.name+"</b><small>"+c.desc+"</small></span><button class='mini' onclick='visitCustom("+i+")'>"+t("checkin2")+"</button></div>";
      });
      h+="</div>";
    }
  }
  if(S.loc==="cafe"){
    h="<h3>"+t("pCafe")+"</h3><div class='list'>";
    allNpcs().forEach(function(n){
      var line = typeof n.line==="string" ? n.line : L(n.line);
      var job = typeof n.job==="string" ? n.job : L(n.job);
      h+="<div class='item'><span>"+n.emoji+" <b>"+n.name+"</b> · "+job+"<small>“"+line+"”</small></span>"
        + "<span><button class='mini' onclick=\"doChat('"+n.id+"')\">"+t("chat")+"</button> "
        + "<button class='mini pink' onclick=\"doGift('"+n.id+"')\" "+(S.gifts>0?"":"disabled")+">"+t("gift")+"</button></span></div>";
    });
    h+="</div>";
  }
  p.innerHTML=h;
  var pl=$("playlist");
  if(pl){
    var lines="<div class='songline'>"+t("playlistBase")+"</div>";
    S.songs.forEach(function(g){
      lines+="<div class='songline'>"+fmt("songHot", g.singer, g.title, g.link?" · "+g.link:"", g.days)+"</div>";
    });
    pl.innerHTML=lines;
  }
}
/* ---------- actions ---------- */
function doSleep(){ S.energy=100; S.hygiene=clamp(S.hygiene+10); S.hunger=clamp(S.hunger-8); S.hour=8; newDay(); sayT("sSleep"); logT("lSleep"); render(); }
function doRest(){ S.energy=clamp(S.energy+18); S.mood=clamp(S.mood+6); advance(2); sayT("sRest"); render(); }
function doShower(){ S.hygiene=clamp(S.hygiene+38); advance(1); sayT("sShower"); render(); }
function doNoodle(){ S.hunger=clamp(S.hunger+14); advance(1); sayT("sNoodle"); render(); }
function doMove(i){
  var rent=HOMES[i].rent;
  if(S.cash<rent){ sayT("sMoveNo", fmtN(rent)); render(); return; }
  S.cash-=rent; S.home=i; S.mood=clamp(S.mood+8);
  sayT("sMoved", L(HOMES[i].name)); logT("lMove", L(HOMES[i].name)); render();
}
function applyJob(i){ var j=JOBS[i]; S.job=j.title.zh; S.jobLevel=1; sayT("sHired", L(j.title)); logT("lHired", L(j.title)); render(); }
function doWork(){
  if(S.energy<22){ sayT("sTired"); render(); return; }
  var pay=jobPay(); S.cash+=pay; S.xp+=10; S.energy=clamp(S.energy-22); S.hunger=clamp(S.hunger-6);
  advance(4); logT("lWork", fmtN(pay));
  var jt=jobTitleObj();
  if(jt && S.xp>=S.jobLevel*40 && S.jobLevel<5){ S.jobLevel+=1; sayT("sPromoted", L(jt.title), S.jobLevel, fmtN(jobPay())); logT("lPromote", L(jt.title), S.jobLevel); }
  else sayT("sWork", fmtN(pay));
  render();
}
function doOfficeChat(){ S.social=clamp(S.social+8); S.energy=clamp(S.energy-4); advance(1); sayT("sOfficeChat"); render(); }
function doDance(){ if(!spendCash(2000)){ render(); return; } S.mood=clamp(S.mood+18); S.social=clamp(S.social+12); S.energy=clamp(S.energy-15); advance(2); sayT("sDance"); logT("lDance"); render(); }
function doClubChat(){
  if(!spendCash(1200)){ render(); return; }
  S.social=clamp(S.social+10); S.mood=clamp(S.mood+6); advance(1);
  var n=NPCS[Math.floor(Math.random()*NPCS.length)];
  S.friends[n.id]=clamp((S.friends[n.id]||0)+4);
  sayT("sClubChat", n.name, 4); render();
}
function doVip(){ if(!spendCoins(30)){ render(); return; } S.mood=clamp(S.mood+26); S.social=clamp(S.social+16); advance(2); sayT("sVip"); logT("lVip"); render(); }
function doHotel(tier){
  if(tier===0){ if(!spendCash(8000)){ render(); return; } S.mood=clamp(S.mood+8); S.hygiene=100; sayT("sHotelStd"); logT("lHotel", t("hotelStd")); }
  else { if(!spendCoins(40)){ render(); return; } S.mood=clamp(S.mood+22); S.hunger=clamp(S.hunger+15); S.hygiene=100; sayT("sHotelLux"); logT("lHotel", t("hotelLux")); }
  S.energy=100; S.hour=8; newDay(); render();
}
function doTea(){ if(!spendCash(3000)){ render(); return; } S.mood=clamp(S.mood+10); S.social=clamp(S.social+5); advance(1); sayT("sTea"); render(); }
function doEat(i){ var f=FOODS[i]; if(!spendCash(f.price)){ render(); return; } S.hunger=clamp(S.hunger+f.hunger); S.mood=clamp(S.mood+f.mood); advance(1); sayT("sEat", L(f.name), L(f.desc)); logT("lEat", L(f.name)); render(); }
function doKtv(tier){
  if(tier===0){ if(!spendCash(1500)){ render(); return; } S.mood=clamp(S.mood+12); S.social=clamp(S.social+6); advance(2); sayT("sKtv0"); }
  else{
    if(!spendCoins(20)){ render(); return; }
    S.mood=clamp(S.mood+24); S.social=clamp(S.social+14); advance(3);
    if(Math.random()<0.35){ S.coins+=15; sayT("sKtv1Tip"); } else sayT("sKtv1");
  }
  logT("lKtv"); render();
}
function doBuy(i){
  var g=GOODS[i]; if(!spendCash(g.price)){ render(); return; }
  if(g.once) S.items.push(g.name.zh); else S.gifts+=1;
  S.mood=clamp(S.mood+6); sayT("sBuy", L(g.name), L(g.tag)); logT("lBuy", L(g.name)); advance(1); render();
}
function visitBiz(){ S.mood=clamp(S.mood+5); advance(1); sayT("sBiz"); render(); }
function doWalk(){
  advance(1); S.mood=clamp(S.mood+5);
  var r=Math.random();
  if(r<0.25){ S.cash+=500; sayT("sWalk1"); }
  else if(r<0.5){ var n=NPCS[Math.floor(Math.random()*NPCS.length)]; S.friends[n.id]=clamp((S.friends[n.id]||0)+3); sayT("sWalk2", n.name); }
  else sayT("sWalk3");
  render();
}
function doMarket(){ if(!spendCash(1000)){ render(); return; } S.mood=clamp(S.mood+9); advance(1); sayT("sMarket"); render(); }
function visitCustom(i){ var c=S.customShops[i]; S.mood=clamp(S.mood+6); S.social=clamp(S.social+3); advance(1); sayT("sCustom", c.name, c.desc); render(); }
function doChat(id){
  var n=npcById(id);
  var gain=5 + (hasItem("智能手机")?2:0);
  var line = typeof n.line==="string" ? n.line : L(n.line);
  if(S.hygiene<25){ gain=Math.max(1, Math.floor(gain/2)); S.friends[id]=clamp((S.friends[id]||0)+gain); S.social=clamp(S.social+3); advance(1); sayT("sChatDirty", n.name, "", gain); }
  else { S.friends[id]=clamp((S.friends[id]||0)+gain); S.social=clamp(S.social+6); advance(1); sayT("sChat", n.name, line, gain); }
  render();
}
function doGift(id){ if(S.gifts<=0) return; S.gifts-=1; var n=npcById(id); S.friends[id]=clamp((S.friends[id]||0)+18); sayT("sGift", n.name); logT("lGift", n.name); render(); }
function doRepay(){
  if(S.debt<=0) return;
  var amt=Math.min(5000, S.debt, S.cash);
  if(amt<=0){ sayT("sNoCash"); render(); return; }
  S.cash-=amt; S.debt-=amt;
  if(S.debt<=0){ S.debt=0; sayT("sRepayDone"); } else sayT("sRepay", fmtN(amt), fmtN(S.debt));
  logT("lRepay", fmtN(amt)); render();
}
/* ---------- modals ---------- */
function openModal(k){ $("modal-"+k).classList.add("show"); if(k==="topup") renderPacks(); if(k==="custom") renderCustomList(); }
function closeModal(k){ $("modal-"+k).classList.remove("show"); }
function renderPacks(){
  var w=$("packs"); w.innerHTML="";
  PACKS.forEach(function(pk,i){
    var d=document.createElement("div");
    d.className="pack"+(i===selPack?" sel":"");
    d.innerHTML="<span>🪙 "+fmtN(pk.coins)+" "+t("coinUnit")+"</span><span>"+pk.price+"</span>";
    d.onclick=function(){ selPack=i; renderPacks(); };
    w.appendChild(d);
  });
}
function payDemo(gw){
  var pk=PACKS[selPack];
  $("payMsg").textContent=fmt("payProc", gw);
  setTimeout(function(){
    S.coins+=pk.coins;
    $("payMsg").textContent=fmt("payOk", pk.coins, gw);
    logT("lTopup", pk.coins); sayT("sStart"); render();
  }, 900);
}
function submitMerchant(){
  var biz=$("mBiz").value.trim(); if(!biz){ $("mMsg").textContent=t("meNeedName"); return; }
  var place=$("mPlace").value;
  var cost= place==="street"?20 : (place==="mall"?30:40);
  if(!spendCoins(cost)){ $("mMsg").textContent=fmt("meNoCoins", cost); render(); return; }
  S.ads.push({biz:biz, cat:$("mCat").value, place:place, days:3});
  $("mMsg").textContent=fmt("meOk", biz);
  logT("lMerchant", biz); render();
}
function submitSinger(){
  var nm=$("sName").value.trim(), tt2=$("sTitle").value.trim();
  if(!nm || !tt2){ $("sMsg").textContent=t("siNeed"); return; }
  if(!spendCoins(25)){ $("sMsg").textContent=t("siNoCoins"); render(); return; }
  S.songs.push({singer:nm, title:tt2, link:$("sLink").value.trim(), days:3});
  $("sMsg").textContent=fmt("siOk", tt2);
  logT("lSinger", nm, tt2); render();
}
function submitCustom(){
  var nm=$("cName").value.trim(); if(!nm){ $("cMsg").textContent=t("cuNeedName"); return; }
  var ty=$("cType").value, d=$("cDesc").value.trim();
  if(ty==="shop"){ S.customShops.push({name:nm, desc:d||nm}); }
  else { S.customNpcs.push({name:nm, desc:d||t("myFriend")}); }
  $("cMsg").textContent= ty==="shop" ? t("cuOkShop") : t("cuOkNpc");
  $("cName").value=""; $("cDesc").value="";
  logT("lCustom", nm); renderCustomList(); render();
}
function renderCustomList(){
  var w=$("customList"); if(!w) return;
  var h="";
  S.customShops.forEach(function(c){ h+="<div class='item'><span>🏪 "+c.name+"</span><small>"+c.desc+"</small></div>"; });
  S.customNpcs.forEach(function(c){ h+="<div class='item'><span>🧑 "+c.name+"</span><small>"+c.desc+"</small></div>"; });
  w.innerHTML=h ? "<h4 style='margin:12px 0 6px'>"+t("addedH")+"</h4>"+h : "";
}
$("nameInput").addEventListener("change", function(){ var v=this.value.trim(); if(v){ S.name=v; render(); } });
$("btnReset").onclick=function(){
  if(confirm(t("confirmReset"))){
    var keepLang=LANG; S=fresh(); save(); LANG=keepLang;
    $("modal-start").classList.add("show"); render();
  }
};
if(!S.started){ $("modal-start").classList.add("show"); }
render();
</script>
</body>
</html>
